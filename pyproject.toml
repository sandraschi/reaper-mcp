[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaper-mcp"
version = "1.0.0"
description = "Austrian precision digital audio workstation automation via Reaper DAW"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Sandra", email = "sandraschipal@gmail.com"}
]
maintainers = [
    {name = "Sandra", email = "sandraschipal@gmail.com"}
]
keywords = ["mcp", "reaper", "daw", "audio", "automation", "osc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "reapy-boost>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "python-osc>=1.8.0",
    "httpx>=0.27.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio", "httpx"]
dev = ["ruff>=0.16.0,<0.17", "mypy", "pre-commit>=4.6.1"]

[project.urls]
Homepage = "https://github.com/sandraschi/reaper-mcp"
Documentation = "https://github.com/sandraschi/reaper-mcp#readme"
Repository = "https://github.com/sandraschi/reaper-mcp"
Issues = "https://github.com/sandraschi/reaper-mcp/issues"
Changelog = "https://github.com/sandraschi/reaper-mcp/blob/main/CHANGELOG.md"

[project.scripts]
reaper-mcp = "reaper_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["reaper_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "reaper_mcp/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=reaper_mcp",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["reaper_mcp"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "reaper_mcp/__main__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
